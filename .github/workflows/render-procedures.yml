name: Render laboratory procedures

on:
  push:
    paths:
      - "procedimentos/**"
      - ".github/workflows/render-procedures.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: render-procedures
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render procedure documents
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            quarto render "$file" --to html
          done < <(find procedimentos -type f -name '*.qmd' -print0)

      - name: Commit rendered documents
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Render laboratory procedures"
          commit_user_name: github-actions[bot]
          commit_user_email: 41898282+github-actions[bot]@users.noreply.github.com
